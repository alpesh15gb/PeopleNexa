# PeopleNexa — host-level nginx reverse proxy.
# Install: sudo cp deploy/nginx.conf /etc/nginx/conf.d/peoplenexa.conf
# (or into sites-available + symlink on Debian/Ubuntu).
#
# The app container listens only on 127.0.0.1:3012 (set APP_PORT in the env; see docker-compose.yml),
# so nginx is the public edge. `proxy_set_header Host $host` forwards the real
# hostname, which the app's proxy.ts uses to resolve the tenant subdomain
# (crk.peoplenexa.in → tenant "crk").
#
# TLS: a single wildcard certificate covers the root domain + every tenant
# subdomain. Get it once with certbot (DNS-01 challenge, wildcard support):
#
#   sudo certbot certonly --manual --preferred-challenges dns \
#     -d peoplenexa.in -d '*.peoplenexa.in'
#
# and set up a cron/oneshot renewal:
#
#   0 3 * * * sudo certbot renew --quiet --deploy-hook "systemctl reload nginx"

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name peoplenexa.in *.peoplenexa.in;

    # certbot webroot challenge (if you switch from DNS to webroot later)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peoplenexa.in *.peoplenexa.in;

    ssl_certificate     /etc/letsencrypt/live/peoplenexa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplenexa.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Selfie photos attached to punches — keep the limit comfortably above.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # App
    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Long-cache Next.js immutable assets (hashed filenames)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3012;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Expose the health endpoint to uptime monitors (no auth needed)
    location = /api/health {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
